<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Pressure Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c0392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BP Tracker">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    padding: 24px 16px 40px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    font-size: 22px;
    color: #c0392b;
    text-align: center;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }

  /* ── Entry card ── */
  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.09);
    padding: 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 15px;
    color: #333;
    margin-bottom: 14px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .field label {
    font-size: 12px;
    color: #666;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field input {
    padding: 8px 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    width: 90px;
  }
  .field input:focus { border-color: #c0392b; }
  .field.date-field input { width: 148px; }

  .add-btn {
    padding: 9px 20px;
    background: #c0392b;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    align-self: flex-end;
  }
  .add-btn:hover { background: #a93226; }

  #entry-status {
    font-size: 12px;
    color: #c0392b;
    margin-top: 8px;
    min-height: 16px;
  }

  /* ── Chart ── */
  .chart-btn {
    width: 100%;
    padding: 11px;
    background: #2980b9;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 18px;
  }
  .chart-btn:hover { background: #2471a3; }

  #chart-wrap {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.09);
    padding: 20px 16px 16px;
    margin-bottom: 18px;
    display: none;
  }
  #chart-wrap h2 {
    font-size: 15px;
    color: #333;
    margin-bottom: 12px;
    text-align: center;
  }

  .legend {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 13px;
  }
  .legend-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  canvas { display: block; width: 100% !important; }

  /* ── Log table ── */
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .log-header h2 { font-size: 15px; color: #333; }

  .log-actions { display: flex; gap: 8px; }

  .clear-btn {
    padding: 5px 12px;
    background: #e74c3c;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .clear-btn:hover { background: #c0392b; }

  .export-btn {
    padding: 5px 12px;
    background: #27ae60;
    color: #fff;
    border: none;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
  }
  .export-btn:hover { background: #1e8449; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th {
    background: #f7f7f7;
    color: #555;
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid #eee;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  td {
    padding: 8px 10px;
    border-bottom: 1px solid #f0f0f0;
    color: #333;
  }
  tr:last-child td { border-bottom: none; }
  td.del-cell { text-align: right; }
  .del-btn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }
  .del-btn:hover { color: #e74c3c; }

  .empty-msg {
    text-align: center;
    color: #bbb;
    font-size: 14px;
    padding: 20px 0;
  }

  /* BP level colour coding */
  .normal   { color: #27ae60; font-weight: bold; }
  .elevated { color: #f39c12; font-weight: bold; }
  .high     { color: #e74c3c; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <h1>❤️ Blood Pressure Tracker</h1>
  <p class="subtitle">Log your readings and view trends over time</p>

  <!-- Entry card -->
  <div class="card">
    <h2>Add a Reading</h2>
    <div class="input-row">
      <div class="field date-field">
        <label>Date</label>
        <input type="date" id="inp-date">
      </div>
      <div class="field">
        <label>Systolic</label>
        <input type="number" id="inp-sys" placeholder="120" min="60" max="250">
      </div>
      <div class="field">
        <label>Diastolic</label>
        <input type="number" id="inp-dia" placeholder="80" min="40" max="150">
      </div>
      <button class="add-btn" onclick="addReading()">+ Add</button>
    </div>
    <div id="entry-status"></div>
  </div>

  <!-- Chart button -->
  <button class="chart-btn" onclick="toggleChart()">📈 Show Chart</button>

  <!-- Chart -->
  <div id="chart-wrap">
    <h2>Blood Pressure Over Time</h2>
    <div class="legend">
      <span><span class="legend-dot" style="background:#c0392b;"></span>Systolic</span>
      <span><span class="legend-dot" style="background:#2980b9;"></span>Diastolic</span>
    </div>
    <canvas id="bp-chart"></canvas>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="log-header">
      <h2>Reading Log</h2>
      <div class="log-actions">
        <button class="export-btn" onclick="exportTxt()">⬇ Export .txt</button>
        <button class="clear-btn" onclick="clearAll()">Clear All</button>
      </div>
    </div>
    <div id="log-body"></div>
  </div>
</div>

<script>
  // ── Storage ───────────────────────────────────────────────────────────────
  function loadReadings() {
    try { return JSON.parse(localStorage.getItem('bp-readings') || '[]'); }
    catch(e) { return []; }
  }
  function saveReadings(r) {
    try { localStorage.setItem('bp-readings', JSON.stringify(r)); } catch(e) {}
  }

  let readings = loadReadings(); // [{date, sys, dia}] sorted by date

  // Set today's date as default
  document.getElementById('inp-date').value = new Date().toISOString().slice(0,10);

  // ── Add reading ───────────────────────────────────────────────────────────
  function addReading() {
    const date = document.getElementById('inp-date').value;
    const sys  = parseInt(document.getElementById('inp-sys').value, 10);
    const dia  = parseInt(document.getElementById('inp-dia').value, 10);
    const status = document.getElementById('entry-status');

    if (!date)            { status.textContent = 'Please choose a date.'; return; }
    if (!sys || sys < 60) { status.textContent = 'Enter a valid systolic value (60–250).'; return; }
    if (!dia || dia < 40) { status.textContent = 'Enter a valid diastolic value (40–150).'; return; }
    if (dia >= sys)       { status.textContent = 'Diastolic should be lower than systolic.'; return; }

    readings.push({ date, sys, dia });
    readings.sort((a, b) => a.date.localeCompare(b.date));
    saveReadings(readings);

    document.getElementById('inp-sys').value = '';
    document.getElementById('inp-dia').value = '';
    status.textContent = 'Reading added ✓';
    setTimeout(() => status.textContent = '', 2000);

    renderLog();
    if (document.getElementById('chart-wrap').style.display !== 'none') drawChart();
  }

  // ── Delete one reading ────────────────────────────────────────────────────
  function deleteReading(idx) {
    readings.splice(idx, 1);
    saveReadings(readings);
    renderLog();
    if (document.getElementById('chart-wrap').style.display !== 'none') drawChart();
  }

  // ── Clear all ─────────────────────────────────────────────────────────────
  function clearAll() {
    if (!confirm('Delete all readings?')) return;
    readings = [];
    saveReadings(readings);
    renderLog();
    if (document.getElementById('chart-wrap').style.display !== 'none') drawChart();
  }

  // ── BP category helper ────────────────────────────────────────────────────
  function bpClass(sys, dia) {
    if (sys < 120 && dia < 80)  return ['normal',   'Normal'];
    if (sys < 130 && dia < 80)  return ['elevated', 'Elevated'];
    return                             ['high',      'High'];
  }

  // ── Render log ────────────────────────────────────────────────────────────
  function renderLog() {
    const body = document.getElementById('log-body');
    if (readings.length === 0) {
      body.innerHTML = '<p class="empty-msg">No readings yet — add one above!</p>';
      return;
    }

    // Show newest first in the table
    const rows = [...readings].reverse().map((r, ri) => {
      const realIdx = readings.length - 1 - ri;
      const [cls, label] = bpClass(r.sys, r.dia);
      const displayDate = new Date(r.date + 'T12:00:00').toLocaleDateString(undefined, {
        month: 'short', day: 'numeric', year: 'numeric'
      });
      return `<tr>
        <td>${displayDate}</td>
        <td>${r.sys}/${r.dia}</td>
        <td class="${cls}">${label}</td>
        <td class="del-cell"><button class="del-btn" onclick="deleteReading(${realIdx})" title="Delete">×</button></td>
      </tr>`;
    }).join('');

    body.innerHTML = `<table>
      <thead><tr><th>Date</th><th>BP</th><th>Level</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  // ── Toggle chart ──────────────────────────────────────────────────────────
  function toggleChart() {
    const wrap = document.getElementById('chart-wrap');
    const btn  = document.querySelector('.chart-btn');
    if (wrap.style.display === 'none' || wrap.style.display === '') {
      wrap.style.display = 'block';
      btn.textContent = '📈 Hide Chart';
      drawChart();
    } else {
      wrap.style.display = 'none';
      btn.textContent = '📈 Show Chart';
    }
  }

  // ── Draw chart (pure canvas, no library needed) ───────────────────────────
  function drawChart() {
    const canvas = document.getElementById('bp-chart');
    const wrap   = canvas.parentElement;

    // Size canvas to container width
    const W = wrap.clientWidth - 32;  // 16px padding each side
    const H = Math.round(W * 0.5);    // 2:1 aspect
    canvas.width  = W;
    canvas.height = H;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';

    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    if (readings.length === 0) {
      ctx.fillStyle = '#bbb';
      ctx.font = '14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('No readings to display yet.', W / 2, H / 2);
      return;
    }

    // ── Layout margins ──
    const ml = 52, mr = 16, mt = 16, mb = 52;
    const cw = W - ml - mr;
    const ch = H - mt - mb;

    // ── Data range ──
    const allVals = readings.flatMap(r => [r.sys, r.dia]);
    const minV = Math.max(40,  Math.floor((Math.min(...allVals) - 10) / 10) * 10);
    const maxV = Math.min(220, Math.ceil((Math.max(...allVals) + 10) / 10) * 10);

    function xPos(i)   { return ml + (readings.length === 1 ? cw / 2 : i / (readings.length - 1) * cw); }
    function yPos(val) { return mt + ch - (val - minV) / (maxV - minV) * ch; }

    // ── Grid lines & Y labels ──
    ctx.strokeStyle = '#efefef';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#999';
    ctx.font = '11px Arial';
    ctx.textAlign = 'right';

    const step = (maxV - minV) <= 60 ? 10 : 20;
    for (let v = minV; v <= maxV; v += step) {
      const y = yPos(v);
      ctx.beginPath(); ctx.moveTo(ml, y); ctx.lineTo(W - mr, y); ctx.stroke();
      ctx.fillText(v, ml - 6, y + 4);
    }

    // ── Reference lines (120/80) ──
    function refLine(val, label, color) {
      if (val < minV || val > maxV) return;
      const y = yPos(val);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.moveTo(ml, y); ctx.lineTo(W - mr, y); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = color;
      ctx.font = '10px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(label, W - mr - 2, y - 3);
    }
    refLine(120, '120', '#c0392b');
    refLine(80,  '80',  '#2980b9');

    // ── X axis labels ──
    ctx.fillStyle = '#666';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';

    // Show up to ~8 labels without crowding
    const maxLabels = Math.min(readings.length, 8);
    const step2 = Math.ceil(readings.length / maxLabels);

    readings.forEach((r, i) => {
      if (i % step2 !== 0 && i !== readings.length - 1) return;
      const x = xPos(i);
      const d = new Date(r.date + 'T12:00:00');
      const label = (d.getMonth() + 1) + '/' + d.getDate();
      ctx.fillText(label, x, H - mb + 16);
    });

    // ── Axis lines ──
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ml, mt); ctx.lineTo(ml, H - mb);
    ctx.lineTo(W - mr, H - mb);
    ctx.stroke();

    // ── Axis titles ──
    ctx.fillStyle = '#777';
    ctx.font = '12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Date', ml + cw / 2, H - 4);

    ctx.save();
    ctx.translate(13, mt + ch / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('mmHg', 0, 0);
    ctx.restore();

    // ── Draw lines ──
    function drawLine(key, color) {
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      readings.forEach((r, i) => {
        const x = xPos(i), y = yPos(r[key]);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Dots
      readings.forEach((r, i) => {
        const x = xPos(i), y = yPos(r[key]);
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
    }

    drawLine('dia', '#2980b9');
    drawLine('sys', '#c0392b');

    // ── Value labels on dots (if few points) ──
    if (readings.length <= 10) {
      readings.forEach((r, i) => {
        const x = xPos(i);
        ctx.font = 'bold 10px Arial';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#c0392b';
        ctx.fillText(r.sys, x, yPos(r.sys) - 8);
        ctx.fillStyle = '#2980b9';
        ctx.fillText(r.dia, x, yPos(r.dia) + 16);
      });
    }
  }

  // ── Enter key to add ──────────────────────────────────────────────────────
  ['inp-date','inp-sys','inp-dia'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') addReading();
    });
  });

  // ── Export as .txt ────────────────────────────────────────────────────────
  function exportTxt() {
    if (readings.length === 0) { alert('No readings to export yet.'); return; }

    const lines = [
      'Blood Pressure Log',
      '==================',
      `Exported: ${new Date().toLocaleDateString(undefined, {year:'numeric',month:'long',day:'numeric'})}`,
      '',
      `${'Date'.padEnd(16)}${'Systolic'.padEnd(12)}${'Diastolic'.padEnd(12)}Level`,
      '-'.repeat(52)
    ];

    [...readings].reverse().forEach(r => {
      const d = new Date(r.date + 'T12:00:00').toLocaleDateString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric' });
      const [, label] = bpClass(r.sys, r.dia);
      lines.push(`${d.padEnd(16)}${String(r.sys).padEnd(12)}${String(r.dia).padEnd(12)}${label}`);
    });

    lines.push('', '-'.repeat(52));
    lines.push(`Total readings: ${readings.length}`);

    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `bp-log-${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── Register service worker (PWA offline support) ─────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  renderLog();
</script>
</body>
</html>
